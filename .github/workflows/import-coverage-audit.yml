name: Badminton Importbestand lesen
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1' # wöchentlich, kein Import, nur bounded read-only inventory
  push:
    branches: [main]
    paths:
      - 'scripts/import-coverage-audit.mjs'
      - '.github/workflows/import-coverage-audit.yml'
permissions:
  contents: read
jobs:
  import-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditlogik ohne Netzwerk testen
        run: node scripts/import-coverage-audit.test.mjs
      # Pull/push checks use synthetic fixtures only; never query production in CI.
      # The scheduled live audit is narrow, read-only, and prints aggregate counts only.
      - name: Wöchentliche anonyme Quellabdeckung (nur lesen)
        if: github.event_name == 'schedule'
        run: node scripts/import-coverage-audit.mjs --live --aggregate-only
      # Manual detailed live inventory remains explicitly opt-in.
      - name: Supabase-Datenbestand ausschließlich lesen
        if: github.event_name == 'workflow_dispatch'
        env:
          AUDIT_OUTPUT: audit-report.json
        run: node scripts/import-coverage-audit.mjs --live
      - name: Prüfbericht als GitHub-Artefakt
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: import-coverage-report
          path: audit-report.json
          retention-days: 7
