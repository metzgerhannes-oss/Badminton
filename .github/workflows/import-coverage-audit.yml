name: Badminton Importbestand – Offline-Audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-coverage-audit.mjs'
      - 'scripts/import-coverage-audit.test.mjs'
      - 'scripts/match-reconciliation-audit.mjs'
      - 'scripts/match-reconciliation-audit.test.mjs'
      - '.github/workflows/import-coverage-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import-coverage-audit.mjs'
      - 'scripts/import-coverage-audit.test.mjs'
      - 'scripts/match-reconciliation-audit.mjs'
      - 'scripts/match-reconciliation-audit.test.mjs'
      - '.github/workflows/import-coverage-audit.yml'
permissions:
  contents: read
jobs:
  import-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ausschließlich synthetische Offline-Fixtures, keine Produktionsabfragen
        run: |
          node scripts/import-coverage-audit.test.mjs
          node scripts/match-reconciliation-audit.test.mjs
