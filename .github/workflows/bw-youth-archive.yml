name: Baden-Württemberg Jugend A/B/C Historie
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-bw-youth-archive.py'
      - 'tests/test_bw_youth_archive.py'
      - '.github/workflows/bw-youth-archive.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import-bw-youth-archive.py'
      - 'tests/test_bw_youth_archive.py'
      - '.github/workflows/bw-youth-archive.yml'
permissions:
  contents: read
concurrency:
  group: bw-youth-archive
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Offline parser and classification tests
        run: python3 -m unittest discover -s tests -p test_bw_youth_archive.py -v
      - name: Verify full-year DBV source (not remaining dates)
        run: |
          python3 scripts/import-bw-youth-archive.py --write-json
          python3 -c 'import json; p=json.load(open("data/bw-youth-calendar-archive.json",encoding="utf-8")); print("PUBLIC_BW_ARCHIVE="+json.dumps(p,ensure_ascii=False,separators=(",",":")))'

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh verified public historical BW archive
        run: python3 scripts/import-bw-youth-archive.py --write-json
      - name: Commit source-backed archive only when it changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bw-youth-calendar-archive.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh public BW youth A/B/C calendar archive [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
