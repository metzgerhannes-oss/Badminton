name: Baden-Württemberg Jugend A/B/C Historie (offline)
# Source acquisition and publication require separate rights approval (#56).
# This workflow is strictly synthetic and never refreshes production data.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-bw-youth-archive.py'
      - 'tests/test_bw_youth_archive.py'
      - '.github/workflows/bw-youth-archive.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/import-bw-youth-archive.py'
      - 'tests/test_bw_youth_archive.py'
      - '.github/workflows/bw-youth-archive.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic BW archive parser and classification tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_bw_youth_archive.py -v
          python3 -m py_compile scripts/import-bw-youth-archive.py
