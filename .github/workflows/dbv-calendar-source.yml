name: DBV-Kalender Import und Quellenabgleich
# Fetch only official public DBV events. GitHub OIDC scopes the backend writer to main.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
      - 'data/dbv-calendar.json'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
      - 'tests/p0-ci-prod-isolation.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic calendar parsing and OIDC contract tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_dbv_calendar.py -v
          python3 -m unittest discover -s tests -p test_dbv_calendar_oidc.py -v
          python3 -m py_compile scripts/import-dbv-calendar.py scripts/publish-dbv-calendar-oidc.py
      - name: Inspect live official DBV event panels (read-only, public fields)
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("dbv_parser","scripts/import-dbv-calendar.py")
          lib=importlib.util.module_from_spec(spec);spec.loader.exec_module(lib)
          try:
           html=lib.read_page(lib.calendar_url(2026))
           parser=lib.TableRows();parser.feed(html)
           print("DBV source rows",len(parser.rows),"event panels",len(parser.panels))
           for key in ("44749","43826"):
            row=next((r for r in parser.rows if r["id"]==key),None)
            links=(row["links"] if row else [])+parser.panels.get(key,[])
            print("Event",key,"calendar row",bool(row),
                  "inline links",len(row["links"]) if row else 0,
                  "panel links",len(parser.panels.get(key,[])),
                  "verified direct",bool(lib.verified_detail_link({"links":links})))
            print("public row hrefs",key,[value[:210] for value in (row["links"] if row else [])])
            hit=html.find('id="collapse'+key+'"')
            if hit<0:hit=html.find("id='collapse"+key+"'")
            if hit>=0:print("expanded DBV markup",key," ".join(html[hit:hit+1700].split())[:1700])

            if not lib.verified_detail_link({"links":links}):
             at=html.find("#collapse"+key)
             if at<0:at=html.find("collapse"+key)
             print("event markup hint",key,
                  " ".join(html[max(0,at-90):at+520].split())[:540] if at>=0 else "source marker missing")
          except Exception as error:
           print("DBV source diagnostic unavailable:",type(error).__name__,str(error)[:180])
          PY

  publish:
    # No privileged writes from untrusted pull requests or preview branches.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Parse current official DBV calendar and retain exact tournament links
        run: |
          set -euo pipefail
          python3 scripts/import-dbv-calendar.py --year 2026 --write-json --export-payload /tmp/dbv-calendar-payload.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/dbv-calendar-payload.json').read_text(encoding='utf-8'))['entries']
          direct=[row for row in rows if row.get('event_url')]
          print('DBV: %d verified rows, %d source-linked tournament detail pages'%(len(rows),len(direct)))
          for key in ('dbv-calendar-44749','dbv-calendar-43826'):
           hit=next((r for r in rows if r['source_key']==key),None)
           print('DBV official',key,'present='+str(bool(hit)),'direct='+str(bool(hit and hit.get('event_url'))))
          if len(rows)<50:raise RuntimeError('Source unexpectedly small; refusing partial sync')
          PY
      - name: Publish verified public DBV fields to Badminton Supabase only
        run: |
          set -euo pipefail
          python3 scripts/publish-dbv-calendar-oidc.py --payload /tmp/dbv-calendar-payload.json
      - name: Retain reproducible official snapshot on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dbv-calendar.json
          if ! git diff --cached --quiet; then
            git commit -m "data(DBV): refresh verified calendar and source-provided event URLs"
            git push origin HEAD:main
          fi
