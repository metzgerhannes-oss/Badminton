name: DBV-Kalender Import
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
      - 'data/dbv-calendar.json'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
  push:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
permissions:
  contents: read
concurrency:
  group: badminton-dbv-calendar
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Offline calendar parsing tests
        run: |
          python3 -m unittest discover -s tests -p test_dbv_calendar.py -v
          python3 -m unittest discover -s tests -p test_dbv_calendar_oidc.py -v
      - name: Validate official complete calendar table
        run: python3 scripts/import-dbv-calendar.py
      - name: Export checked 2027 tournament rows for emergency recovery (PR only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/import-dbv-calendar.py --emit-lines
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Parse complete public DBV calendar and export restricted payload
        run: python3 scripts/import-dbv-calendar.py --write-json --export-payload "$RUNNER_TEMP/dbv-calendar-payload.json"
      - name: Publish official DBV calendar to Supabase with short-lived GitHub OIDC identity
        run: python3 scripts/publish-dbv-calendar-oidc.py --payload "$RUNNER_TEMP/dbv-calendar-payload.json"
      - name: Publish updated public DBV calendar snapshot only if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dbv-calendar.json
          if git diff --cached --quiet; then
            echo "No DBV calendar snapshot changes"
            exit 0
          fi
          git commit -m 'data: refresh source-backed public DBV tournament calendar [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
