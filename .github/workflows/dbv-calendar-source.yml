name: DBV-Kalender Import
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
      - 'data/dbv-calendar.json'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
  push:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'scripts/publish-dbv-calendar-oidc.py'
      - 'supabase/functions/dbv-calendar-publish/index.ts'
      - 'supabase/config.toml'
      - 'tests/test_dbv_calendar.py'
      - 'tests/test_dbv_calendar_oidc.py'
      - '.github/workflows/dbv-calendar-source.yml'
permissions:
  contents: read
concurrency:
  group: badminton-dbv-calendar
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Offline calendar parsing tests
        run: |
          python3 -m unittest discover -s tests -p test_dbv_calendar.py -v
          python3 -m unittest discover -s tests -p test_dbv_calendar_oidc.py -v
      - name: Validate official complete calendar table
        run: python3 scripts/import-dbv-calendar.py
