name: DBV-Kalender Import
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'tests/test_dbv_calendar.py'
      - '.github/workflows/dbv-calendar-source.yml'
      - 'data/dbv-calendar.json'
  push:
    branches: [main]
    paths:
      - 'scripts/import-dbv-calendar.py'
      - 'tests/test_dbv_calendar.py'
      - '.github/workflows/dbv-calendar-source.yml'
permissions:
  contents: read
concurrency:
  group: badminton-dbv-calendar
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Offline calendar parsing tests
        run: python3 -m unittest discover -s tests -p test_dbv_calendar.py -v
      - name: Validate official complete calendar table
        run: python3 scripts/import-dbv-calendar.py
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read verified official DBV calendar and optionally upsert Supabase
        env:
          BADMINTON_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BADMINTON_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/import-dbv-calendar.py --write-json --sync-supabase
      - name: Publish updated public DBV calendar snapshot only if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dbv-calendar.json
          if git diff --cached --quiet; then
            echo "No DBV calendar snapshot changes"
            exit 0
          fi
          git commit -m 'data: refresh source-backed public DBV tournament calendar [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
