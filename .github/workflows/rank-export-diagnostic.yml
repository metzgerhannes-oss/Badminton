name: Inspect Official Ranking Export
on:
  push:
    paths:
      - .github/workflows/rank-export-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official ranking export link
        run: |
          python - <<'PY'
          import urllib.request,re,html
          u="https://turniere.badminton.de/ranking"
          request=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          raw=urllib.request.urlopen(request,timeout=20).read(600000).decode("utf-8","replace")
          print("HTML bytes",len(raw))
          for pattern in ["Download Rangliste",r'href="[^"]*(?:xlsx|download|export)[^"]*"',r'<form[^>]*>',"zuletzt aktualisiert"]:
            found=re.search(pattern,raw,re.I)
            if found:
              excerpt=raw[max(0,found.start()-380):found.end()+480]
              print("FIND",pattern,repr(excerpt[:1100]))
          for link in re.findall(r'(?:href|action)=["\']([^"\']+)["\']',raw,re.I):
            if any(x in link.lower() for x in ('download','export','xlsx','excel','ranking')):
              print("LINK",html.unescape(link)[:280])
          PY
