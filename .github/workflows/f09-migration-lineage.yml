name: F09 offline migration lineage
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/f09-migration-lineage.mjs'
      - 'tests/f09-migration-lineage.mjs'
      - 'docs/F09_MIGRATION_REPLAY_READINESS.md'
      - '.github/workflows/f09-migration-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/f09-migration-lineage.mjs'
      - 'tests/f09-migration-lineage.mjs'
      - '.github/workflows/f09-migration-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-lineage-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic migration mismatch regression
        run: |
          node --check scripts/f09-migration-lineage.mjs
          node tests/f09-migration-lineage.mjs
      - name: Repository inventory only (no secrets, database, or network)
        run: node scripts/f09-migration-lineage.mjs --inventory-only
