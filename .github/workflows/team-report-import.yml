name: Mannschaftsberichte (offline source contract)
# The actual editorial-source scan/publish is blocked pending #56.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-team-reports.py'
      - 'scripts/discover-reports.py'
      - 'data/report-sources.json'
      - 'tests/test_team_report_discovery.py'
      - 'tests/test_report_discovery.py'
      - '.github/workflows/team-report-import.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/import-team-reports.py'
      - 'scripts/discover-reports.py'
      - 'data/report-sources.json'
      - 'tests/test_team_report_discovery.py'
      - 'tests/test_report_discovery.py'
      - '.github/workflows/team-report-import.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic report discovery, privacy and deduplication tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_report_discovery.py -v
          python3 -m unittest discover -s tests -p test_team_report_discovery.py -v
          python3 -m py_compile scripts/import-team-reports.py scripts/discover-reports.py
