name: Inspect current DBV ranking export
on:
  push:
    paths:
      - .github/workflows/probe-ranking-current.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Python Excel reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Inspect latest official Excel download
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from openpyxl import load_workbook
          from io import BytesIO
          import re
          root="https://turniere.badminton.de"
          h={"User-Agent":"Mozilla/5.0 (Schmetterlinge mobile dashboard)","Accept":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream;q=0.9"}
          page=urlopen(Request(root+"/ranking",headers={"User-Agent":"Mozilla/5.0"}),timeout=25).read().decode("utf-8","replace")
          print("RANKING_TITLE",re.findall(r"Rangliste KW\s*\d+",page)[:4])
          print("LIVE_DOWNLOAD_ENDPOINT",root+"/ranking/download")
          with urlopen(Request(root+"/ranking/download",headers=h),timeout=50) as resp:
            content=resp.read(48*1024*1024+1)
            print("STATUS",resp.status,"CONTENT_TYPE",resp.headers.get("Content-Type"),"CONTENT_DISPOSITION",resp.headers.get("Content-Disposition"))
          print("BYTES",len(content),"ZIP",content.startswith(b"PK"))
          if not content.startswith(b"PK"): print("SNIPPET",repr(content[:400]));quit()
          wb=load_workbook(BytesIO(content),read_only=True,data_only=True)
          for ws in wb.worksheets:
            print("SHEET",ws.title,"ROWS",ws.max_row,"COLUMNS",ws.max_column)
            for row in list(ws.iter_rows(values_only=True,max_row=5)):
              print("ROW",str(row[:18])[:1800])
            matches=[]
            for row in ws.iter_rows(values_only=True):
              if "05-070879" in [str(x) for x in row]:
                matches.append(row[:18])
            print("PHILIPP",matches[:5])
          wb.close()
          PY
