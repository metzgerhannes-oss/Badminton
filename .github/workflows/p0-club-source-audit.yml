name: P0 SpVgg source coverage (read only)
on:
  push:
    branches: [fix/p0-dbv-match-source-v152]
    paths: [scripts/p0-club-source-audit.mjs, .github/workflows/p0-club-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source coverage for the 13 registered players, no identities logged
        run: node scripts/p0-club-source-audit.mjs
