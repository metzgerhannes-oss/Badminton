name: Schmetterlinge Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: schmetterlinge-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check app.js
          node --check dashboard.js
          node --check history.js
          node --check scripts/trophy-stats.mjs
          node --check sw.js
          node tests/validate.mjs
          node tests/history.mjs
          node tests/trophies.mjs
          node tests/bookmarks.mjs
          node tests/friends.mjs
          node tests/profile-switch.mjs
          node tests/dashboard.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
