name: v136 invitation and results smoke
on:
  pull_request:
    branches: [main, fix/p0-417-private-member-reads-20261027]
    paths:
      - "database/**"
      - "supabase/**"
      - "tests/private-player-scope-isolation.mjs"
      - "app-access.js"
      - "app-access.css"
      - "invite.js"
      - "welcome.js"
      - "consented-player-data.js"
      - "tests/e2e/invitation-repair.spec.mjs"
      - "index.html"
      - "player-data-status.js"
      - "tests/e2e/invite-only-access.spec.mjs"
      - "tests/e2e/v138-player-shell.spec.mjs"
      - "tests/e2e/v138-owner-invites.spec.mjs"
      - "tests/e2e/v138-member-copy.spec.mjs"
      - "scripts/owner-invites-overview.mjs"
      - "scripts/private-match-source.mjs"
      - "scripts/private-trophy-source.mjs"
      - "tests/private-rpc-error-classification.mjs"
      - "settings-rooms.js"
      - ".github/workflows/v136-invitation-smoke.yml"
      - ".github/workflows/ux-navigation.yml"
      - ".github/workflows/match-age-context.yml"
  workflow_dispatch:
jobs:
  invited-mobile:
    runs-on: ubuntu-latest
    # Pinned browser/dependency image prevents APT mirror timeout on retry.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify pinned preinstalled Chromium and WebKit
        run: |
          node -e 'const fs=require("node:fs"); const p=require("playwright"); for(const name of ["chromium","webkit"]){const path=p[name].executablePath();if(!fs.existsSync(path))throw Error(name+" browser missing: "+path);console.log(name+" browser available");}'
      - name: Enforce offline Supabase browser test contract
        run: node tests/browser-qa-supabase-isolation.mjs
      - name: Verify invited entry and revocation
        run: npx playwright test tests/e2e/invite-only-access.spec.mjs tests/e2e/v138-player-shell.spec.mjs tests/e2e/v138-owner-invites.spec.mjs tests/e2e/v138-member-copy.spec.mjs tests/e2e/invitation-repair.spec.mjs --workers=2 --retries=0 --reporter=line
