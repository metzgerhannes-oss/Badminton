name: P0 Source URL research (read only)
on:
  push:
    branches: [research/charlotte-benjamin-original-sources-20261015]
    paths: [scripts/p0-source-url-research.mjs, .github/workflows/p0-source-url-research.yml]
permissions:
  contents: read
jobs:
  source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/p0-source-url-research.mjs
