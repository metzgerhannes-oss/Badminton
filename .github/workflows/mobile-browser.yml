name: Schmetterlinge Mobile Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded PR/main revisions do not need another full browser/test cycle.
# Keep manual runs independent; all new final revisions still get their own QA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mobile-browser:
    name: Mobile UX · Chromium and WebKit
    runs-on: ubuntu-latest
    # Official image includes matching Chromium/WebKit and system libraries.
    # Avoid repeated 20-minute APT mirror stalls on hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Verify pinned preinstalled browser engines
        run: |
          node -e 'const fs=require("node:fs"); const p=require("playwright"); for(const name of ["chromium","webkit"]){const path=p[name].executablePath();if(!fs.existsSync(path))throw Error(name+" browser missing: "+path);console.log(name+" browser available");}'
      - name: Verify QA Supabase network isolation
        run: node tests/browser-qa-supabase-isolation.mjs
      - name: Exercise user journeys on narrow screens
        run: npm run test:mobile
      - name: Preserve failing screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
