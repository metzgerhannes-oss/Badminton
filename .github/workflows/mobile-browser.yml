name: Schmetterlinge Mobile Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/p0-417-private-member-reads-20261027]
  workflow_dispatch:
  schedule:
    # A full offline Chromium/WebKit regression on main every night.
    - cron: "23 2 * * *"

# Superseded PR/main revisions do not need another full browser/test cycle.
# Keep manual runs independent; all new final revisions still get their own QA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: Browser QA risk tier (fail closed)
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.policy.outputs.tier }}
      risk: ${{ steps.policy.outputs.risk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Determine required browser tier for changed paths
        id: policy
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-test-tier.mjs
  mobile-browser:
    needs: classify
    if: needs.classify.outputs.tier != 'none'
    name: Mobile UX · ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [small-chromium, mobile-webkit]
    # Official image includes matching Chromium/WebKit and system libraries.
    # Avoid repeated 20-minute APT mirror stalls on hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Verify pinned preinstalled browser engines
        run: |
          node -e 'const fs=require("node:fs"); const p=require("playwright"); for(const name of ["chromium","webkit"]){const path=p[name].executablePath();if(!fs.existsSync(path))throw Error(name+" browser missing: "+path);console.log(name+" browser available");}'
      - name: Verify QA Supabase network isolation
        run: node tests/browser-qa-supabase-isolation.mjs
      - name: Complete offline Chromium and WebKit regression (R2/daily)
        if: needs.classify.outputs.tier == 'full'
        run: npm run test:mobile -- --project=${{ matrix.project }}
      - name: Targeted Chromium and WebKit smoke (R1)
        if: needs.classify.outputs.tier == 'smoke'
        run: |
          npx playwright test tests/e2e/release-gate.spec.mjs tests/e2e/invite-only-access.spec.mjs tests/e2e/wiki.spec.mjs --grep "Compact iPhone layout and dialog buttons remain operable|without an accepted invitation the app shell stays hidden|Wiki: all 61 diagram dialogs fit 320px" --project=${{ matrix.project }} --workers=2 --retries=0 --reporter=line
      - name: Preserve failing screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-diagnostics-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
