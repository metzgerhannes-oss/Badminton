name: Schmetterlinge Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          node --check ui-feedback.js
          node --check state-storage.js
          node --check router.js
          node --check app.js
          node --check backup.js
          node --check scripts/local-backup.mjs
          node --check dashboard.js
          node --check history.js
          node --check scripts/trophy-stats.mjs
          node --check scripts/upcoming-tournaments.mjs
          node --check sw.js
          node --check reports.js
          node --check invite.js
          node --check library.js
          node --check stats.js
          node --check scripts/external-match-stats.mjs
          node --check scripts/import-coverage-audit.mjs
          node --check supabase/functions/history-match-import/source-availability.mjs
          node --check scripts/match-availability.mjs
          node --check friend-search.js
          node --check career-history.js
          node --check external-matches.js
          node --check scripts/badhub-history-parser.mjs
          node --check history-demand.js
          node --check scripts/history-demand.mjs
          node --check scripts/external-history.mjs
          node --check scripts/friend-search.mjs
          node --check scripts/match-stats.mjs
          node --check scripts/library-utils.mjs
          node --check welcome.js
          node --check scripts/invitation.mjs
          node --check live.js
          node --check live-links.js
          node --check live-radar.js
          node --check live-hub.js
          node --check scripts/live-radar.mjs
          node --check scripts/live-links.mjs
      - name: Run tests
        run: |
          node tests/security-gate.mjs
          node tests/validate.mjs
          node tests/history.mjs
          node tests/trophies.mjs
          node tests/bookmarks.mjs
          node tests/upcoming-tournaments.mjs
          node tests/friends.mjs
          node tests/profile-switch.mjs
          node tests/local-backup.mjs
          node tests/state-storage.mjs
          node tests/router.mjs
          node tests/charlotte-profile.mjs
          node tests/dashboard.mjs
          node tests/ranking-points.mjs
          node tests/source-register.mjs
          node tests/invitation.mjs
          node tests/player-library.mjs
          node tests/friend-search.mjs
          node tests/external-history.mjs
          node tests/external-match-parser.mjs
          node tests/source-failover.mjs
          node tests/history-demand.mjs
          node tests/history-status-ux.mjs
          node tests/live-links.mjs
          node tests/live-radar.mjs
          node tests/live-hub.mjs
          node tests/match-stats.mjs
          node tests/source-stats-home.mjs
          node scripts/import-coverage-audit.test.mjs
          node tests/external-match-consistency.mjs
          node tests/match-availability.mjs
          node tests/design-v2.mjs
          node tests/ux-foundation.mjs
          node tests/supabase-library.mjs
          python scripts/test-player-library.py
          python3 -m unittest discover -s tests -p 'test_report_discovery.py' -v
