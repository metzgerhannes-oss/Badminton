name: Schmetterlinge Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          node --check app.js
          node --check history.js
          node --check scripts/trophy-stats.mjs
          node --check sw.js
      - name: Run tests
        run: |
          node tests/validate.mjs
          node tests/history.mjs
          node tests/trophies.mjs
          node tests/bookmarks.mjs
