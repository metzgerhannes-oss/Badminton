name: Schmetterlinge Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          node --check app.js
          node --check dashboard.js
          node --check history.js
          node --check scripts/trophy-stats.mjs
          node --check scripts/upcoming-tournaments.mjs
          node --check sw.js
          node --check reports.js
          node --check invite.js
          node --check library.js
          node --check stats.js
          node --check scripts/match-stats.mjs
          node --check scripts/library-utils.mjs
          node --check welcome.js
          node --check scripts/invitation.mjs
          node --check live.js
      - name: Run tests
        run: |
          node tests/validate.mjs
          node tests/history.mjs
          node tests/trophies.mjs
          node tests/bookmarks.mjs
          node tests/upcoming-tournaments.mjs
          node tests/friends.mjs
          node tests/profile-switch.mjs
          node tests/charlotte-profile.mjs
          node tests/dashboard.mjs
          node tests/ranking-points.mjs
          node tests/source-register.mjs
          node tests/invitation.mjs
          node tests/player-library.mjs
          node tests/match-stats.mjs
          node tests/design-v2.mjs
          node tests/supabase-library.mjs
          python scripts/test-player-library.py
          python3 -m unittest discover -s tests -p 'test_report_discovery.py' -v
