name: Schmetterlinge Tests
on:
  # Backend-only branch: run the same synthetic, read-only suite before private deploy.
  # No production Supabase/DBV credentials or source requests in these jobs.
  push:
    branches: [main, ops/private-dbv-import-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded PR/main revisions do not need another full browser/test cycle.
# Keep manual runs independent; all new final revisions still get their own QA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
