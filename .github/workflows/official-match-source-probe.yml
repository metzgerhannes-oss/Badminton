name: P0 DBV source format probe
on:
  push:
    branches: [fix/p0-dbv-match-source-v152]
    paths: [scripts/probe-official-source.mjs, .github/workflows/official-match-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published tournament source format, no match data logged
        run: node scripts/probe-official-source.mjs
