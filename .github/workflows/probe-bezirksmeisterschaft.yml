name: Verify Bezirksmeisterschaft U11 results
on:
  push:
    paths: ['.github/workflows/probe-bezirksmeisterschaft.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public source for exact player and tournament
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from html.parser import HTMLParser
          class Visible(HTMLParser):
              skip=0
              text=[]
              def handle_starttag(self,t,a):
                  if t in ('script','style'):self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style'):self.skip=max(0,self.skip-1)
              def handle_data(self,d):
                  if not self.skip:self.text.append(d)
          addresses=[
            "https://badhub.de/spieler/05-070879",
            "https://badhub.de/spieler/05-070879?saison=2026&src=turnier",
            "https://dbv.turnier.de/tournament/0477D9EC-DA56-4B16-938D-138CC817E8E2",
            "https://dbv.turnier.de/player-profile/A7CCCDAE-8A57-4D13-BB2A-5B6084671153"
          ]
          for url in addresses:
              print("SOURCE",url)
              try:
                  response=urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0 (Schmetterlinge results verification)"}),timeout=22)
                  html=response.read(2500000).decode("utf-8","replace")
                  parser=Visible();parser.feed(html)
                  text=" ".join(" ".join(parser.text).split())
                  print("HTTP",response.status,"CHARS",len(text),"TITLE",text[:300])
                  for term in ("35. Bezirksmeisterschaft","35. Bezirksmeisterschaft","11. Jul 2026","Philipp Metzger","JE U11","JD U11","Platz 3","Platz 1"):
                      start=0
                      for k in range(3):
                          idx=text.lower().find(term.lower(),start)
                          if idx<0:break
                          print("MATCH",term,repr(text[max(0,idx-180):idx+750]))
                          start=idx+len(term)
              except (HTTPError,URLError,ValueError) as exc:print("ERROR",str(exc)[:250])
          PY
