name: Probe DBV Profile Lookup
on:
  push:
    paths:
      - .github/workflows/probe-dbv-profile-link.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public link resolution alternatives
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import re
          urls=[
            "https://badhub.de/spieler/05-070879?saison=2026&src=turnier",
            "https://dbv.turnier.de/player-profile/A7CCCDAE-8A57-4D13-BB2A-5B6084671153"
          ]
          for url in urls:
            print("SOURCE",url,flush=True)
            with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0","Origin":"https://metzgerhannes-oss.github.io"}),timeout=20) as response:
              body=response.read(300000).decode("utf8","replace")
              print("DEST",response.url,"CORS",response.headers.get("Access-Control-Allow-Origin"),flush=True)
            for term in ["A7CCCDAE","player-profile/","cookie", "accept", "dataprotection","05-070879"]:
              hits=list(re.finditer(re.escape(term),body,re.I))
              print("FIND",term,len(hits),flush=True)
              for m in hits[:3]:
                print("CONTEXT",repr(body[max(0,m.start()-130):m.end()+220])[:450],flush=True)
          PY
      - name: Inspect public DBV player profile and access headers
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError,URLError
          import re
          from html import unescape
          pages=[
            "https://dbv.turnier.de/player-profile/A7CCCDAE-8A57-4D13-BB2A-5B6084671153",
            "https://dbv.turnier.de/find/player?q=Philipp+Metzger",
            "https://badhub.de/spieler/05-070879?saison=2026&src=turnier"
          ]
          for url in pages:
            print("SOURCE",url,flush=True)
            try:
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0 (Schmetterlinge profile validation)","Origin":"https://metzgerhannes-oss.github.io","Accept":"text/html"}),timeout=24) as response:
                raw=response.read(1700000)
                print("HTTP",response.status,"REDIRECT",response.url,"TYPE",response.headers.get("Content-Type"),"CORS",response.headers.get("Access-Control-Allow-Origin"),"BYTES",len(raw),flush=True)
              text=raw.decode("utf8","replace")
              title=re.search(r"<title[^>]*>(.*?)</title>",text,re.I|re.S)
              print("TITLE",unescape(re.sub("<[^>]*>","",title.group(1)))[:300] if title else "",flush=True)
              for term in ("05-070879","Spieler-ID","Player ID","Philipp Metzger","Geburtsjahr","birthyear","birthYear","2016","SpVgg Mössingen"):
                match=re.search(re.escape(term),text,re.I)
                if match:print("CONTEXT",term,repr(text[max(0,match.start()-130):match.end()+230])[:700],flush=True)
            except (HTTPError,URLError,TimeoutError,ValueError) as e:print("ERROR",str(e)[:330],flush=True)
          PY
