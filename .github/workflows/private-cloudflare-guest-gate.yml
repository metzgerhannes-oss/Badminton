name: "P0 #417 private Cloudflare Access external guest-deny"
on:
  push:
    branches:
      - fix/p0-417-private-member-reads-20261027
    paths:
      - .github/workflows/private-cloudflare-guest-gate.yml
      - scripts/build-private-pages.mjs
      - tests/private-pages-build.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Anonymous browser must not receive the private PWA"
        shell: bash
        run: |
          set -euo pipefail
          base="https://schmetterlinge-familie.pages.dev"
          # Both the canonical domain and the exact currently deployed build
          # must block anonymous requests, including direct JS/JSON paths.
          for host in "$base" "https://17d7f2b3.schmetterlinge-familie.pages.dev"; do
            for path in "/" "/index.html" "/scripts/supabase-read.mjs" "/data/dbv-calendar.json"; do
              headers="$(mktemp)"
              body="$(mktemp)"
              code="$(curl --silent --show-error --max-time 20 --connect-timeout 10 \
                --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
                "$host$path")"
              case "$code" in
                401|403) ;;
                301|302|303|307|308)
                  # A redirect is acceptable only to the Cloudflare Access
                  # authentication flow, not a public asset mirror.
                  if ! grep -Eiq '^location:[[:space:]]*https?://[^[:space:]]*\.cloudflareaccess\.com(/|[[:space:]]|\?)|^location:[[:space:]]*/cdn-cgi/access/' "$headers"; then
                    echo "::error::Unexpected unprotected redirect for $host$path (HTTP $code)"
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::Anonymous content exposed or unverified: $host$path HTTP $code"
                  exit 1
                  ;;
              esac
              echo "Private guest deny OK: $host$path HTTP $code"
              rm -f "$headers" "$body"
            done
          done

      - name: "iOS Home Screen icon is a real PNG without Access login"
        shell: bash
        run: |
          set -euo pipefail
          for host in "https://schmetterlinge-familie.pages.dev" "https://17d7f2b3.schmetterlinge-familie.pages.dev"; do
            headers="$(mktemp)"
            png="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --connect-timeout 10 \
              --dump-header "$headers" --output "$png" --write-out '%{http_code}' \
              "$host/assets/schmetterlinge-apple-touch-icon-180.png")"
            if [ "$code" != "200" ]; then
              echo "::error::iOS cannot fetch touch icon without Access cookies: HTTP $code at $host"
              exit 1
            fi
            if ! grep -Eiq '^content-type:[[:space:]]*image/png' "$headers"; then
              echo "::error::Touch icon response is not image/png at $host"
              exit 1
            fi
            python3 - "$png" <<'PY'
          import sys,struct
          with open(sys.argv[1],"rb") as f:
              head=f.read(24)
          assert len(head)==24 and head[:8]==b"\x89PNG\r\n\x1a\n", "Missing PNG signature"
          assert struct.unpack(">II",head[16:24])==(180,180), "Wrong iOS touch icon dimensions"
          PY
            echo "iOS touch icon OK (200, image/png, 180x180): $host"
            rm -f "$headers" "$png"
          done
