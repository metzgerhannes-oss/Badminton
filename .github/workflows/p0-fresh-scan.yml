name: P0 SpVgg nightly match reconciliation
on:
  push:
    branches: [main, fix/p0-fresh-results-import-v152]
    paths:
      - scripts/p0-fresh-source-scan.mjs
      - scripts/p0-stage-results-oidc.mjs
      - .github/workflows/p0-fresh-scan.yml
      - supabase/functions/spvgg-match-rebuild/index.ts
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source and OIDC client syntax
        run: |
          node --check scripts/p0-fresh-source-scan.mjs
          node --check scripts/p0-stage-results-oidc.mjs
      - name: Read the 13 original public match sources without database writes
        if: github.ref != 'refs/heads/main'
        run: node scripts/p0-fresh-source-scan.mjs
      - name: Incrementally reconcile 13 club match sources with authenticated OIDC and coverage validation
        if: github.ref == 'refs/heads/main'
        run: node scripts/p0-fresh-source-scan.mjs --stage
