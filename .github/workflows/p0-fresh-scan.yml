name: P0 SpVgg offline source contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-fresh-scan.yml'
      - 'scripts/p0-fresh-source-scan.mjs'
      - 'scripts/p0-stage-results-oidc.mjs'
      - 'supabase/functions/spvgg-match-rebuild/index.ts'
      - 'tests/p0-ci-prod-isolation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-fresh-scan.yml'
      - 'scripts/p0-fresh-source-scan.mjs'
      - 'scripts/p0-stage-results-oidc.mjs'
      - 'supabase/functions/spvgg-match-rebuild/index.ts'
      - 'tests/p0-ci-prod-isolation.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify synthetic/offline source contract
        run: |
          node --check scripts/p0-fresh-source-scan.mjs
          node --check scripts/p0-stage-results-oidc.mjs
          node --check scripts/badhub-tournament-view-parser.mjs
          node tests/badhub-tournament-view-parser.mjs
          node tests/p0-ci-prod-isolation.mjs
