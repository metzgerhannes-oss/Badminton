name: BWBV Jugend A/B/C Quellenimport (offline)
# No real BWBV/DBV fetch, automatic publish or Pages trigger in CI.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-bwbv-youth-calendar.py'
      - 'tests/test_bwbv_youth_calendar.py'
      - '.github/workflows/bwbv-youth-calendar.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/import-bwbv-youth-calendar.py'
      - 'tests/test_bwbv_youth_calendar.py'
      - '.github/workflows/bwbv-youth-calendar.yml'
      - 'tests/p0-ci-prod-isolation.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic BWBV planning-source parser tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_bwbv_youth_calendar.py -v
          python3 -m py_compile scripts/import-bwbv-youth-calendar.py
