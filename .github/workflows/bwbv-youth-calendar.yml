name: BWBV Jugend A/B/C Quellenimport
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-bwbv-youth-calendar.py'
      - 'tests/test_bwbv_youth_calendar.py'
      - '.github/workflows/bwbv-youth-calendar.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import-bwbv-youth-calendar.py'
      - 'tests/test_bwbv_youth_calendar.py'
      - '.github/workflows/bwbv-youth-calendar.yml'
permissions:
  contents: read
concurrency:
  group: badminton-bwbv-source-calendar
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Ensure free PDF text extractor
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Validate official source parser offline
        run: python3 -m unittest discover -s tests -p test_bwbv_youth_calendar.py -v
      - name: Check actual BWBV and DBV sources
        run: python3 scripts/import-bwbv-youth-calendar.py --write-json
      - name: Output confirmed public source rows
        run: |
          python3 - <<'PY'
          import json
          j=json.load(open('data/bwbv-youth-framework-2027.json',encoding='utf-8'))
          print('BW_SOURCE_EVENTS='+json.dumps(j,ensure_ascii=False,separators=(',',':')))
          PY
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure free PDF text extractor
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Refresh BWBV/DBV source snapshot
        run: python3 scripts/import-bwbv-youth-calendar.py --write-json
      - name: Commit only verified source changes
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bwbv-youth-framework-2027.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh verified BW youth A/B/C schedule [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Publish updated calendar via GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w '%{http_code}' -X POST             "https://api.github.com/repos/metzgerhannes-oss/Badminton/pages/builds"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28")
          [ "$status" = "201" ] || { echo "Pages build request failed: $status"; exit 1; }
