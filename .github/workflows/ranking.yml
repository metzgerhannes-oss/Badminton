name: DBV Jahrgangs-Rangliste
on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ranking.yml'
      - 'scripts/update-ranking.py'
      - 'scripts/player-library.py'
      - 'scripts/test-ranking.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: schmetterlinge-ranking
  cancel-in-progress: false
jobs:
  ranking:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ranking parser dependency
        run: python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
      - name: Verify Excel parser and age-class comparisons
        run: |
          python scripts/test-ranking.py
          python scripts/test-player-library.py
      - name: Load current official DBV ranking and latest archived week
        env:
          BADMINTON_PLAYER_IDS: '05-070879,05-071969'
          DEBUG_RANKING_SCHEMA: '1'
        run: python scripts/update-ranking.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json data/player-library/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public DBV age-class ranking snapshot [skip ci]'
            # Other UI commits may land during this official Excel download.
            # Rebase safely on current main instead of silently losing the data update.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Ranking snapshot published on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Ranking data push failed after four safe attempts" >&2
                exit 1
              fi
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy ranking update
        id: deployment
        uses: actions/deploy-pages@v4
